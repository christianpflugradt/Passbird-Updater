name: Statistics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  collect:
    name: Collect statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install pinned scc
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: aqua:boyter/scc
      - name: Run tests and calculate coverage
        run: ./gradlew test jacocoTestReport
      - name: Write coverage metrics
        run: python3 .github/scripts/write-coverage-metrics.py build/reports/jacoco/test/jacocoTestReport.xml build/statistics
      - name: Write lines of code and test count metrics
        run: |
          scc --format json --include-ext kt src/main >build/scc.json
          python3 .github/scripts/write-count-metrics.py build/scc.json build/test-results/test build/statistics
      - name: Upload statistics metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: statistics-metrics
          path: build/statistics
          if-no-files-found: error

  publish:
    name: Publish statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - collect
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: statistics-metrics
          path: metrics
      - name: Send statistics to badges-and-stuff
        env:
          GH_TOKEN: ${{ secrets.STATISTICS_TOKEN }}
        run: |
          set -euo pipefail
          jq --slurp \
            --arg project passbird-updater \
            --arg commit "$GITHUB_SHA" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event_type: "statistics", client_payload: {project: $project, commit: $commit, timestamp: $timestamp, metrics: .}}' \
            metrics/*.json >payload.json
          gh api --method POST repos/christianpflugradt/badges-and-stuff/dispatches --input payload.json
