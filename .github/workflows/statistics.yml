name: Statistics
on:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  collect:
    name: Collect statistics
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install pinned scc
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: aqua:boyter/scc
          experimental: true
          version: 2026.11.11
      - name: Run tests and calculate coverage
        run: ./gradlew test jacocoTestReport
      - name: Write coverage metrics
        run: python3 .github/scripts/write-coverage-metrics.py build/reports/jacoco/test/jacocoTestReport.xml build/statistics
      - name: Write lines of code and test count metrics
        run: |
          scc --format json --include-ext kt src/main >build/scc.json
          python3 .github/scripts/write-count-metrics.py build/scc.json build/test-results/test build/statistics
      - name: Upload statistics metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: statistics-metrics
          path: build/statistics
          if-no-files-found: error

  publish:
    name: Publish statistics
    needs:
      - collect
    if: github.ref == 'refs/heads/main'
    uses: christianpflugradt/repository-catalog/.github/workflows/statistics-publish.yml@19e626fc8f927a8d909d6d7c11761096294b22c0 # updates/workflows/statistics
    with:
      project: passbird-updater
    secrets:
      STATISTICS_TOKEN: ${{ secrets.STATISTICS_TOKEN }}
