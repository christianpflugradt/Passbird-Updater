name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release a patch version even if no commit would raise the version, to test the release process
        type: boolean
        default: false
  schedule:
    - cron: '17 4 1 * *' # Monthly; a run without releasable commits publishes nothing.

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: 'false' # Keep jobs limited to their explicit tool subsets.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: christianpflugradt/repository-catalog/.github/workflows/release-plan.yml@7804bdd85b2bfb225ae1dbcd684ebbc9192fe6bf # updates/workflows/release
    with:
      force: ${{ inputs.force }}

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    uses: christianpflugradt/repository-catalog/.github/workflows/release-readiness.yml@7804bdd85b2bfb225ae1dbcd684ebbc9192fe6bf # updates/workflows/release
    with:
      source-sha: ${{ needs.plan.outputs.source_sha }}
      required-jobs: check / Check

  release-candidate:
    name: Release Candidate (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: python java github:please-behave/cli
          experimental: true
          version: 2026.11.11
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build the release candidate jar
        run: ./gradlew jar
      - name: Verify the candidate at the release point
        uses: christianpflugradt/repository-catalog/actions/release/governance@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
      - name: Record release candidate evidence
        uses: christianpflugradt/repository-catalog/actions/release/evidence@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          operation: record
          version: ${{ needs.plan.outputs.version }}
          target: ${{ matrix.os }}
  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: python node
          experimental: true
          version: 2026.11.11
      - name: Verify release candidate evidence
        uses: christianpflugradt/repository-catalog/actions/release/evidence@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          operation: verify
          version: ${{ needs.plan.outputs.version }}
      - name: Publish semantic release
        uses: christianpflugradt/repository-catalog/actions/release/publish-release@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          source-sha: ${{ needs.plan.outputs.source_sha }}
          gateway-url: ${{ secrets.GATEWAY_URL }}
          force: ${{ inputs.force }}
          assets: build/libs/passbird-updater.jar
