name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release a patch version even if no commit would raise the version, to test the release process
        type: boolean
        default: false
  schedule:
    - cron: '17 4 1 * *' # Monthly; a run without releasable commits publishes nothing.

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: 'false' # Keep jobs limited to their explicit tool subsets.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-plan.yml@aa0b0b05864581c26e4f5f9f1024c1411c6b172f # updates/workflows/release
    with:
      force: ${{ inputs.force }}

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-readiness.yml@aa0b0b05864581c26e4f5f9f1024c1411c6b172f # updates/workflows/release
    with:
      source-sha: ${{ needs.plan.outputs.source_sha }}
      required-jobs: check / Check

  release-candidate:
    name: Release Candidate (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python java github:please-behave/cli
          experimental: true
          version: 2026.11.11
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build the release candidate jar
        run: ./gradlew jar
      - name: Verify the candidate at the release point
        uses: christianpflugradt/please-behave-governance/actions/release/governance@97a2570e70f0ae008ecde59f6878f44d55a399fa # updates/actions/release
      - name: Record release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@97a2570e70f0ae008ecde59f6878f44d55a399fa # updates/actions/release
        with:
          operation: record
          version: ${{ needs.plan.outputs.version }}
          target: ${{ matrix.os }}
  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node
          experimental: true
          version: 2026.11.11
      - name: Verify release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@97a2570e70f0ae008ecde59f6878f44d55a399fa # updates/actions/release
        with:
          operation: verify
          version: ${{ needs.plan.outputs.version }}
      - name: Publish semantic release
        uses: christianpflugradt/please-behave-governance/actions/release/publish-release@97a2570e70f0ae008ecde59f6878f44d55a399fa # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          force: ${{ inputs.force }}
          assets: build/libs/passbird-updater.jar
