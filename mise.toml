[task_config]
includes = [
  "git::https://github.com/christianpflugradt/please-behave-governance.git//mise-tasks/release?ref=c37eb9268f0c159f35e2301712269d77c94ad300",
]

[tools]
"github:please-behave/cli" = "0.16.0"
java = "temurin-17"
node = "26.13.1"
python = "3.15.2"
actionlint = "1.7.12"
yq = "4.54.3"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
gh = "2.103.3"
ruff = "0.17.4"
"aqua:boyter/scc" = "4.1.0"
shfmt = "3.14.1"

[tasks.setup]
description = "Fetch locked Gradle dependencies for CI and offline Git hooks"
run = "./gradlew classes testClasses"

[tasks.format]
description = "Format Python and shell sources; Kotlin has no formatter"
run = ["ruff format", "git ls-files -z '*.sh' | xargs -0 -r shfmt -w"]

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.build]
description = "Build the updater jar"
run = "./gradlew jar"
