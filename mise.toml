[tools]
"github:please-behave/cli" = "0.13.1"
java = "temurin-17"
node = "26.13.1"
python = "3.15.2"
actionlint = "1.7.12"
yq = "4.54.3"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
gh = "2.103.3"
ruff = "0.17.4"
"aqua:boyter/scc" = "4.1.0"

[tasks.setup]
description = "Fetch locked npm and Gradle dependencies for CI and offline Git hooks"
run = ["npm ci --ignore-scripts", "./gradlew classes testClasses"]

[tasks.format]
description = "Format Python sources; Kotlin has no formatter"
run = "ruff format"

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.build]
description = "Build the updater jar"
run = "./gradlew jar"

[tasks.release]
description = "Start the Release workflow for remote main"
run = "gh workflow run release.yml --ref main"
